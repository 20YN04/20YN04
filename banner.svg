<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: 'Courier New', 'Consolas', monospace; }
      .sans { font-family: 'Helvetica Neue', 'Arial Black', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="#0a0a0a"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Top frame line -->
  <rect x="0" y="0" width="1200" height="3" fill="#ffffff"/>

  <!-- Top metadata row -->
  <text x="40" y="42" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="2" class="mono">PORTFOLIO / 2026</text>
  <text x="600" y="42" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="2" class="mono" text-anchor="middle">— 01 / IDENTITY</text>
  <text x="1160" y="42" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="2" class="mono" text-anchor="end">N° 20YN04</text>

  <!-- Massive name -->
  <text x="40" y="240" fill="#ffffff" font-size="180" font-weight="900" letter-spacing="-8" class="sans">YENTL</text>

  <!-- Vertical text accent on right -->
  <text transform="translate(1130, 230) rotate(-90)" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="6" class="mono" opacity="0.6">DEVELOPER · DESIGNER · BUILDER</text>

  <!-- Subtitle -->
  <text x="40" y="285" fill="#888" font-size="13" font-weight="400" letter-spacing="6" class="mono">— FULL STACK DEVELOPER · BELGIUM</text>

  <!-- Divider -->
  <line x1="40" y1="320" x2="1160" y2="320" stroke="#333" stroke-width="1"/>

  <!-- Tech inline -->
  <text x="40" y="355" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="2" class="mono">[ NEXT.JS ]</text>
  <text x="170" y="355" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="2" class="mono">[ ANGULAR ]</text>
  <text x="305" y="355" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="2" class="mono">[ LARAVEL ]</text>
  <text x="435" y="355" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="2" class="mono">[ SUPABASE ]</text>
  <text x="575" y="355" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="2" class="mono">[ TYPESCRIPT ]</text>

  <!-- Status indicator -->
  <circle cx="1063" cy="351" r="4" fill="#ffffff">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="1160" y="355" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="2" class="mono" text-anchor="end">AVAILABLE FOR WORK</text>

  <!-- Bottom frame line -->
  <line x1="40" y1="380" x2="1160" y2="380" stroke="#333" stroke-width="1"/>
  <rect x="0" y="397" width="1200" height="3" fill="#ffffff"/>
</svg>
