<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1b1a17" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="400"/>
    </clipPath>
    <style>
      .mono { font-family: 'Courier New', 'Consolas', monospace; }
      .sans { font-family: 'Helvetica Neue', 'Arial Black', Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect width="1200" height="400" fill="#080807"/>
    <rect width="1200" height="400" fill="url(#grid)"/>

    <!-- Oversized ghost monogram (depth + accent) -->
    <text x="700" y="372" fill="none" stroke="#C2410C" stroke-width="1.5"
          font-size="392" font-weight="900" letter-spacing="-22" class="sans" opacity="0.16">YN</text>

    <!-- Left accent bar -->
    <rect x="0" y="0" width="6" height="400" fill="#C2410C"/>

    <!-- Frame hairlines -->
    <rect x="0" y="0" width="1200" height="2" fill="#E8E8E3"/>
    <rect x="0" y="398" width="1200" height="2" fill="#E8E8E3"/>

    <!-- Top metadata row -->
    <text x="56" y="46" fill="#8A8A85" font-size="11" font-weight="700" letter-spacing="3" class="mono">YENTL NERINCKX — PORTFOLIO</text>
    <text x="1144" y="46" fill="#8A8A85" font-size="11" font-weight="700" letter-spacing="3" class="mono" text-anchor="end">N° 20YN04  /  2026</text>

    <!-- Massive name -->
    <text x="52" y="258" fill="#E8E8E3" font-size="196" font-weight="900" letter-spacing="-9" class="sans">YENTL</text>

    <!-- Accent underline -->
    <rect x="56" y="286" width="232" height="5" fill="#C2410C"/>

    <!-- Subtitle -->
    <text x="56" y="324" fill="#8A8A85" font-size="13" font-weight="400" letter-spacing="5" class="mono">FULL-STACK DEVELOPER  ·  DESIGNER  ·  BELGIUM · EU</text>

    <!-- Vertical text accent on right -->
    <text transform="translate(1176, 250) rotate(-90)" fill="#8A8A85" font-size="11" font-weight="700" letter-spacing="6" class="mono" opacity="0.7">DEVELOPER · DESIGNER · BUILDER</text>

    <!-- Divider -->
    <line x1="56" y1="350" x2="1144" y2="350" stroke="#2A2A27" stroke-width="1"/>

    <!-- Tech inline -->
    <text x="56" y="382" fill="#E8E8E3" font-size="11" font-weight="700" letter-spacing="2" class="mono">NEXT.JS</text>
    <text x="148" y="382" fill="#2A2A27" font-size="11" font-weight="700" class="mono">/</text>
    <text x="166" y="382" fill="#E8E8E3" font-size="11" font-weight="700" letter-spacing="2" class="mono">LARAVEL</text>
    <text x="258" y="382" fill="#2A2A27" font-size="11" font-weight="700" class="mono">/</text>
    <text x="276" y="382" fill="#E8E8E3" font-size="11" font-weight="700" letter-spacing="2" class="mono">TYPESCRIPT</text>
    <text x="392" y="382" fill="#2A2A27" font-size="11" font-weight="700" class="mono">/</text>
    <text x="410" y="382" fill="#E8E8E3" font-size="11" font-weight="700" letter-spacing="2" class="mono">ANGULAR</text>

    <!-- Status indicator -->
    <circle cx="1038" cy="378" r="4" fill="#C2410C">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="1144" y="382" fill="#E8E8E3" font-size="11" font-weight="700" letter-spacing="2" class="mono" text-anchor="end">OPEN TO WORK</text>
  </g>
</svg>
